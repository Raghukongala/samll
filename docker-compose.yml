version: "3.9"

networks:
  microservices:
    driver: bridge

services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      USER_SERVICE_URL: http://user-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002
      ORDER_SERVICE_URL: http://order-service:8003
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - microservices
    restart: unless-stopped

  user-service:
    build: ./services/user-service
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
    networks:
      - microservices
    restart: unless-stopped

  product-service:
    build: ./services/product-service
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
    networks:
      - microservices
    restart: unless-stopped

  order-service:
    build: ./services/order-service
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      USER_SERVICE_URL: http://user-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002
    networks:
      - microservices
    restart: unless-stopped
